name: nightly

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation (infection)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            repo.packagist.org:443
            packagist.org:443
            deb.debian.org:443
            pecl.php.net:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: Run mutation tests
        run: just mutation

  smoke:
    name: smoke (production)
    # The smoke environment admits main only; main becomes the default branch at release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: smoke
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            repo.packagist.org:443
            packagist.org:443
            deb.debian.org:443
            pecl.php.net:443
            api.hushscript.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: Run the production smoke test
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: just smoke
