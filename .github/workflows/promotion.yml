name: promotion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation (infection)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            repo.packagist.org:443
            packagist.org:443
            deb.debian.org:443
            pecl.php.net:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Run mutation tests
        run: just mutation

  smoke:
    name: smoke (production)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    # The smoke environment admits main only; main becomes the default branch at release.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: smoke
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            repo.packagist.org:443
            packagist.org:443
            deb.debian.org:443
            pecl.php.net:443
            api.hushscript.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Run the production smoke test
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: just smoke
